<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookshelf Apps</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <div id="toast"></div>

  <body>

    <h1>Bookshelf Apps</h1>

    <div class="top-bar">
      <section class="search-section">
          <input id="searchBookTitle" type="text" placeholder="Cari judul buku...">
      </section>
      

      <button id="openAddModal"> + Tambah Buku</button>
      <button id="btnImport" class="action-btn-outline">📦 Import Dummy</button>
    </div>

    <div class="stats">
      <div class="stat">
        <h3 id="totalBooks">0</h3>
        <p>Total Buku</p>
        <button class="delete-shelf-btn" id="resetBooks">🗑 Hapus Semua Buku</button>
      </div>

      <div class="stat">
        <h3 id="completeBooks">0</h3>
        <p>Selesai dibaca</p>
        <button class="delete-shelf-btn" id="clearComplete">🗑 Hapus semua buku yang sudah selesai dibaca</button>
      </div>

      <div class="stat">
        <h3 id="incompleteBooks">0</h3>
        <p>Belum selesai dibaca</p>
        <button class="delete-shelf-btn" id="clearIncomplete">🗑 Hapus semua buku yang belum selesai dibaca</button>
      </div>
    </div>

    

    <div class="bookshelf-container">

      <section class="shelf">
        <div class="shelf-header">
          <h2>Belum selesai dibaca</h2>
          <button class="bulk-btn-complete" id="markAllComplete">
            ✔ Mark all as read
          </button>
        </div>
        <div id="incompleteBookList" 
        data-testid="incompleteBookList"></div>
      </section>

      <section class="shelf">
        <div class="shelf-header">
          <h2>Selesai dibaca</h2>
          <button class="bulk-btn-incomplete" id="markAllIncomplete">
             Mark all as unread
          </button>
        </div>
        <div id="completeBookList"
        data-testid="completeBookList"></div>
      </section>
    </div>

    <div id="addBookModal" class="modal">

      <div class="modal-content">
        <h2>Tambah Buku</h2>
        <form id="bookForm">

          <input type="text" id="bookFormTitle" 
          placeholder="Judul buku*"required>

          <input type="text" id="bookFormAuthor" 
          placeholder="Penulis*" required>

          <input type="number" id="bookFormYear" 
          placeholder="Tahun*" required>

          
          <div class="form-group">
            <label for="bookFormCover">Link Cover Buku</label>
            <input id="bookFormCover" type="url" placeholder="https://example.com/image.jpg">
          </div>


          <p>* Wajib diisi</p>

          

          <label>
            <input type="checkbox" id="bookFormIsComplete">
            Selesai dibaca
          </label> 

          
          
          <div class="modal-buttons">
            <button type="button" id="closeAddModal" class="btn-cancel">Batal</button>
            <button type="submit" class="btn-submit">
               Tambahkan Buku
            </button>

          

          </div>

        </form>
      </div>
    </div>

    <div id="editModal" class="modal">
      <div class="modal-content">
        <h2>Edit Buku</h2>

        <input id="editTitle" type="text" placeholder="Judul Buku">
        <input id="editAuthor" type="text" placeholder="Penulis">
        <input id="editYear" type="number" placeholder="Tahun">
        <input id="cover" type="url" placeholder="Link Cover Buku">

        <label>
          <input id="editComplete" type="checkbox">
          Selesai dibaca
        </label>

        <div class="modal-buttons">
          <button id="saveEdit" type="submit" class="btn-submit">Simpan</button>
          <button type="button" class="btn-cancel" id="closeEditModal">Batal</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>

  </body>
</html>
