<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookshelf Apps</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <div id="toast"></div>

  <body>

    <h1>Bookshelf Apps</h1>

    <button id="toggleDark">🌙 Dark Mode</button>
    <button id="resetBooks">🗑 Hapus Semua Buku</button>

    <div class="stats">
      <div class="stat">
        <h3 id="totalBooks">0</h3>
        <p>Total Buku</p>
      </div>

      <div class="stat">
        <h3 id="completeBooks">0</h3>
        <p>Selesai</p>
      </div>

      <div class="stat">
        <h3 id="incompleteBooks">0</h3>
        <p>Belum</p>
      </div>
    </div>

    <section>
      <h2>Tambah Buku Baru</h2>

      <form id="bookForm" data-testid="bookForm">

        <input id="bookFormTitle" data-testid="bookFormTitleInput"
        type="text" placeholder="Judul Buku*" required>

        <input id="bookFormAuthor" data-testid="bookFormAuthorInput"
        type="text" placeholder="Penulis*" required>

        <input id="bookFormYear" data-testid="bookFormYearInput" 
        type="number" placeholder="Tahun*" required>

        <label>
          <input id="bookFormIsComplete" 
          data-testid="bookFormIsCompleteCheckbox" type="checkbox">
          Selesai dibaca
        </label>

        <p>* Wajib diisi</p>

        <button id="bookFormSubmit" data-testid="bookFormSubmitButton"
        type="submit">
          Masukkan Buku ke Rak
        </button>

      </form>
    </section>

    <section>
      <h2>Cari Buku</h2>
      <input id="searchBookTitle" 
      data-testid="searchBookFormTitleInput" type="text"
      placeholder="Cari judul buku...">
    </section>

    <div class="bookshelf-container">

      <section class="shelf">
        <h2>Belum selesai dibaca</h2>
        <button id="markAllComplete">✔ Semua selesai</button>

        <div id="incompleteBookList" 
        data-testid="incompleteBookList"></div>
      </section>

      <section class="shelf">
        <h2>Selesai dibaca</h2>
        <button id="markAllIncomplete">
          ↩ Semua belum selesai
        </button>

        <div id="completeBookList"
        data-testid="completeBookList"></div>
      </section>
    </div>

    <div id="editModal" class="modal">

      <div class="modal-content">

        <h2>Edit Buku</h2>

        <input id="editTitle" type="text" placeholder="Judul Buku">
        <input id="editAuthor" type="text" placeholder="Penulis">
        <input id="editYear" type="number" placeholder="Tahun">

        <label>
          <input id="editComplete" type="checkbox">
          Selesai dibaca
        </label>

        <div class="modal-buttons">
          <button id="saveEdit">Simpan</button>
          <button class="cancel-btn" onclick="closeModal()">Batal</button>
        </div>
      </div>
    </div>

    <script src="main.js"></script>

  </body>
</html>
